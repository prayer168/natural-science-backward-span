<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff7f3"><meta name="description" content="八種倒背記憶挑戰：數字、符號、生物圖卡、顏色、方位、聲音、位置與自訂題組，支援限時觸控作答。"><meta property="og:title" content="自然倒背挑戰｜黑熊老師"><meta property="og:description" content="八種關卡、65 種生物圖卡、四或八方位，3～12 個項目，支援限時倒序作答與語音。"><meta property="og:url" content="https://prayer168.github.io/natural-science-backward-span/"><meta property="og:image" content="https://prayer168.github.io/natural-science-backward-span/assets/images/og-cover.png"><meta name="twitter:card" content="summary_large_image"><title>自然倒背挑戰｜黑熊老師</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><header><div class="brand"><img src="assets/site-logo.png" alt="" width="40" height="40"><div><strong>自然倒背挑戰</strong><small>看仔細・記順序・倒著排</small></div></div><div class="tools"><button id="voice" aria-pressed="true">語音：開</button><button id="fullscreen">全螢幕</button></div></header>
<main><aside id="setup"><h1>記住順序，倒過來！</h1><fieldset><legend>挑戰關卡</legend><div class="modes"><button data-mode="digits" aria-pressed="true">123 數字</button><button data-mode="symbols" aria-pressed="false">★ 特殊符號</button><button data-mode="cards" aria-pressed="false">✿ 自然圖卡</button><button data-mode="custom" aria-pressed="false">＋ 自訂題組</button><button data-mode="colors" aria-pressed="false">● 顏色</button><button data-mode="bearings" aria-pressed="false">↗ 方位</button><button data-mode="sounds" aria-pressed="false">♫ 聲音</button><button data-mode="positions" aria-pressed="false">▦ 位置</button></div></fieldset><div class="settings"><label>序列長度<select id="length"></select></label><label>作答限時<select id="limit"></select></label><label>呈現速度<select id="speed"><option value="1600">慢一點</option><option value="1200" selected>剛剛好</option><option value="900">快一點</option></select></label><label>遊戲方式<select id="play"><option value="practice">練習（一題）</option><option value="challenge">挑戰（五題）</option></select></label><label id="bearing-field" hidden>方位數量<select id="bearing-count"><option value="4">四方位</option><option value="8">八方位</option></select></label></div><label id="unit-field" hidden>自然主題<select id="unit"></select></label><label id="custom-field" hidden>自訂詞語（3～12 個）<textarea id="custom" placeholder="種子、嫩芽、葉子" rows="2"></textarea></label><button id="start" class="primary">開始挑戰 ↗</button><p class="note">依序觀看，再從最後一個開始回答。<br>不記名、不排名，專心挑戰自己。</p></aside>
<section class="game"><div class="game-head"><h2 id="title">準備開始了嗎？</h2><span id="round">準備區</span></div><div id="stage"><div id="idle"><div class="welcome">↶</div><h3>看 → 記 → 倒背</h3><p>選好關卡，按下「開始挑戰」。</p></div><div id="show" hidden><p>請記住出現順序</p><div id="token"></div><p id="progress"></p></div><div id="answer" hidden><div class="answer-top"><p>從最後一個開始，倒著回答</p><strong id="countdown" role="timer"></strong></div><div id="slots" aria-label="作答內容"></div><div id="bank"></div><div class="actions"><button id="undo">⌫ 刪除</button><button id="clear">清除</button><button id="submit" class="primary">送出答案</button></div><p id="hint" role="status"></p></div><div id="result" hidden><div id="result-icon" class="welcome"></div><h3 id="result-title"></h3><p id="result-copy"></p><div id="reveal"></div><div class="actions"><button id="replay">再試一次</button><button id="next" class="primary">下一題 →</button></div></div></div><div class="game-foot"><span id="source">今日任務：數字倒背</span><button id="reset">⟳ 重新開始</button></div></section></main>
<footer><button id="credits" type="button">音訊出處</button>版權所有：黑熊老師（陳賢宗）<span>E-MAIL：prayer168@gmail.com</span></footer></div><dialog id="credits-dialog" aria-labelledby="credit-title"><h2 id="credit-title">動物聲音來源與授權</h2><h3 id="credit-name"></h3><p id="credit-author"></p><p id="credit-license"></p><p id="credit-source" class="credit-link"></p><p id="credit-url" class="credit-link"></p><p>素材取自黑熊老師「聲音實驗室」。本版去除開頭靜音、調整音量並轉成最長 4 秒的 MP3，播放時擷取最多 2.5 秒；不改變音高或速度。改作音檔保留原授權。</p><div class="actions"><button id="credit-prev">上一筆</button><button id="credit-next">下一筆</button><button id="credit-close" class="primary">關閉</button></div></dialog><script src="data.js"></script><script src="app.js"></script></body></html>
